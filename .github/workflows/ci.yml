name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly canary: tells you (by GitHub email) when YouTube breaks something

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  live-youtube:
    # Real end-to-end fetch from YouTube. Cloud runner IPs are often bot-checked by YouTube,
    # so a failure here is informative, not fatal. Your home PC is the authoritative live test.
    name: live YouTube canary
    runs-on: windows-latest
    continue-on-error: true
    needs: test
    env:
      YTT_MIN_DELAY_SECONDS: "8"
      YTT_MAX_DELAY_SECONDS: "12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: python -m pip install -e ".[pot]"
      - name: Update YouTube layer + build PO-token provider
        run: python -m yt_transcripts update
      - name: Doctor with live fetch
        shell: bash
        run: |
          set -o pipefail
          python -m yt_transcripts doctor --live CXGGF4ls1JU | tee doctor.json
      - name: Range read (cached, no second YouTube hit)
        shell: bash
        run: python -m yt_transcripts get CXGGF4ls1JU --start 39:30 --end 41:00 | head -c 1500
      - name: Report
        if: always()
        shell: bash
        run: |
          {
            echo "## Live YouTube canary"
            echo '```json'
            cat doctor.json 2>/dev/null | head -c 6000 || echo "no doctor output"
            echo '```'
            echo "### Recent events"
            echo '```'
            python - <<'PY'
          from yt_transcripts.service import Service
          for e in Service().store.recent_events(15):
              print(e["time"], e["level"], e["video_id"], e["message"][:300])
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
