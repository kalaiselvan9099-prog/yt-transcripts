name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # weekly canary: tells you (by GitHub email) when YouTube breaks something

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  live-youtube:
    # Real end-to-end fetch from YouTube. Cloud runner IPs are often bot-checked by YouTube,
    # so a failure here is informative, not fatal. Your home PC is the authoritative live test.
    name: live YouTube canary
    runs-on: windows-latest
    continue-on-error: true
    needs: test
    env:
      YTT_MIN_DELAY_SECONDS: "8"
      YTT_MAX_DELAY_SECONDS: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: python -m pip install -e ".[pot]"
      - name: Update YouTube layer + build PO-token provider
        run: python -m yt_transcripts update
      - name: Doctor with live fetch
        run: python -m yt_transcripts doctor --live CXGGF4ls1JU
      - name: Range read (cached, no second YouTube hit)
        run: python -m yt_transcripts get CXGGF4ls1JU --start 39:30 --end 41:00
