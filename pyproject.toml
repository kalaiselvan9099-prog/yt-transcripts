[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-transcripts"
version = "1.0.0"
description = "Resumable, rate-limited YouTube transcript fetcher with an MCP server and CLI (Claude, Cursor, Codex, VS Code)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # YouTube-facing layer: kept UNPINNED on purpose so `ytt update` can pull fixes the day YouTube changes.
  "yt-dlp[default]>=2025.11.12",
  "youtube-transcript-api>=1.2",
  # Stable layer: pinned to a major version so an SDK rewrite cannot silently break the server.
  "mcp>=1.10,<3",
]

[project.optional-dependencies]
pot = ["bgutil-ytdlp-pot-provider>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
ytt = "yt_transcripts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yt_transcripts = ["patterns.toml", "default_config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
